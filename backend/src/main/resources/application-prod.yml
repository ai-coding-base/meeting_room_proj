server:
  port: 8000

app:
  static:
    # 前端构建产物目录（末尾斜线必须）
    location: /opt/meeting-room2/frontend/dist/

spring:
  datasource:
    url: jdbc:mysql://10.8.0.45:3306/meeting_room_v2?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.company.booking: INFO
    root: WARN
  file:
    name: /opt/meeting-room2/backend/logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
